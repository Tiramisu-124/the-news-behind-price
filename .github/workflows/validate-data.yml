name: Validate price data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/price_data.py validate
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/price-model.test.cjs
      - run: node --check restored.js
      - run: python scripts/build_catalog.py
      - run: git diff --exit-code -- data/observations.csv data/source-registry.json COVERAGE.md
  verify-publisher-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Exercise scheduled sources without changing committed data
        run: python scripts/price_data.py refresh --dry-run
      - name: Confirm published-data files were not modified
        run: git diff --exit-code -- data COVERAGE.md
      - name: Retain publisher check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-refresh-check
          include-hidden-files: true
          path: .cache-data/dry-run-report.json
